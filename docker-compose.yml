services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    profiles: ["ingestion"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    profiles: ["ingestion"]
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  search_service:
    build: ./search_service
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
      - redis
    environment:
      MONGO_URL: mongodb://mongodb:27017
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./search_service:/app
      - ./data:/data:ro
      - search_cache:/root/.cache

  ingestion_service:
    build: ./ingestion_service
    profiles: ["ingestion"]
    depends_on:
      - mongodb
      - kafka
    environment:
      MONGO_URL: mongodb://mongodb:27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./ingestion_service:/app
      - search_cache:/root/.cache

  gateway:
    build: ./gateway
    ports:
      - "3001:3001"
    depends_on:
      - search_service
    environment:
      SEARCH_SERVICE_URL: http://search_service:8000
      PORT: 3001
    volumes:
      - ./gateway:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongo_data:
  search_cache:
